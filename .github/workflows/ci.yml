name: validation
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/unit/test_product_contracts.py -q
      - run: ruff check src/fmcg_sales_intelligence tests/unit/test_product_contracts.py
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/dashboard/package-lock.json}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

      - data/processed/stockout/stockout_v1.parquet
      - data/processed/stockout/stockout_episodes.parquet
      - src/fmcg_sales_intelligence/science/survival/__init__.py
      - src/fmcg_sales_intelligence/science/stockout/__init__.py
    outs:
      - artifacts/canonical/stockout_survival_v1
    metrics:

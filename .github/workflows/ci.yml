name: validation
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install ruff==0.12.11
      - run: ruff check .
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -e '.[dev,mlflow]' matplotlib
      - run: python -m pytest tests/unit tests/engine -q --junitxml=artifacts/test-results.xml
      - run: python -m fmcg_sales_intelligence.integrations.demo --output .demo --mlflow-uri sqlite:///demo-mlflow.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/test-results.xml
            .demo/evidence.json
  docker-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.demo.yml up -d --build --wait --wait-timeout 120
      - run: |
          curl --fail http://127.0.0.1:8000/api/v1/runtime/ready
          curl --fail -X POST http://127.0.0.1:8000/api/v1/models/customer-churn/inferences -H 'Content-Type: application/json' -d '{"version":"1","domain":"customer-retention","rows":[{"months":12,"fee":75,"plan":"monthly"}]}'
          curl --fail -X POST http://127.0.0.1:8000/api/v1/models/demand-demo/inferences -H 'Content-Type: application/json' -d '{"version":"1","domain":"fmcg-demo","rows":[{"previous_units":30,"unit_price":4}]}'
      - run: docker compose -f docker-compose.demo.yml logs --no-color
        if: always()
      - run: docker compose -f docker-compose.demo.yml down
        if: always()
  servicedesk-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f examples/external_company_integration/compose.yml up -d --build --wait --wait-timeout 240
      - run: docker compose -f examples/external_company_integration/compose.yml --profile verification run --build --rm verify
      - name: Prove backend package independence
        run: |
          docker compose -f examples/external_company_integration/compose.yml exec -T servicedesk python -c "import importlib.util; from pathlib import Path; assert importlib.util.find_spec('fmcg_sales_intelligence') is None; assert importlib.util.find_spec('mlflow') is None; assert importlib.util.find_spec('sklearn') is None; assert not Path('/state/approved-models.json').exists()"
          docker compose -f examples/external_company_integration/compose.yml exec -T engine python -c "from pathlib import Path; assert not Path('/company-data/tickets.sqlite').exists()"
      - name: Verify initialization is repeatable
        run: docker compose -f examples/external_company_integration/compose.yml run --rm initialize
      - run: docker compose -f examples/external_company_integration/compose.yml logs --no-color
        if: always()
      - run: docker compose -f examples/external_company_integration/compose.yml down -v
        if: always()

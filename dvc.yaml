stages:
  forecasting_v1:
    cmd: python -m fmcg_sales_intelligence.science.cli run --task forecasting --output artifacts/canonical/forecasting_v1 --experiment-id forecasting_v1_canonical --overwrite
    deps:
      - config/modeling/forecasting.yaml
      - data/processed/forecasting/forecasting_v1.parquet
      - src/fmcg_sales_intelligence/science/__init__.py
      - src/fmcg_sales_intelligence/science/cli.py
      - src/fmcg_sales_intelligence/science/forecasting/__init__.py
      - src/fmcg_sales_intelligence/science/metrics.py
    outs:
      - artifacts/canonical/forecasting_v1
    metrics:
      - artifacts/forecasting_v1_metrics.json
  stockout_classification_v1:
    cmd: python -m fmcg_sales_intelligence.science.cli run --task stockout_classification --output artifacts/canonical/stockout_classification_v1 --experiment-id stockout_classification_v1_canonical --overwrite
